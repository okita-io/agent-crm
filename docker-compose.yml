# Local stack for Agent CRM milestone 1.
#
# Default profile uses Postgres (matches the eventual NAS target) so the whole
# machine runs the way it will in production. To run against the SQLite file
# instead, comment out the `db` service + depends_on and set CRM_DATABASE_URL
# to the sqlite path in a .env file.
#
# Spark SGLang queue: CRM agents must use spark-queue (not Spark directly) so
# Hermes + CRM share one global 4-session GPU cap on Spark.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: agent_crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d agent_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  spark-queue:
    build: .
    command: ["spark-queue"]
    environment:
      # Reach Spark on the ranch LAN via extra_hosts (spark -> 10.0.1.9).
      SPARK_LLM_BASE_URL: http://spark:8888/v1
      SPARK_LLM_MODEL: qwen3.8-27b-sglang
      SPARK_LLM_MAX_CONCURRENCY: "4"
    extra_hosts:
      - "spark:10.0.1.9"
    ports:
      - "8088:8088"

  api:
    build: .
    command: ["api"]
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/agent_crm
      CRM_API_HOST: 0.0.0.0
      CRM_API_PORT: "8000"
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_SEARXNG_URL: http://host.docker.internal:8080
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
      CRM_HUNTER_MAX_PAGES_PER_RUN: "8"
      CRM_HUNTER_SEARCH_RESULT_LIMIT: "15"
      CRM_RESEARCH_MAX_QUERIES_DEFAULT: "12"
      CRM_RESEARCH_MAX_PAGES_PER_RUN: "4"
      CRM_RESEARCH_MAX_MINUTES_DEFAULT: "20"
      CRM_RESEARCH_SEARCH_RESULT_LIMIT: "15"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      spark-queue:
        condition: service_started

  dashboard:
    build: .
    command: ["dashboard"]
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/agent_crm
      CRM_DASHBOARD_PORT: "8501"
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started

volumes:
  crm_pgdata:
