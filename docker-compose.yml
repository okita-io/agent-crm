# Local stack for The Agency (repo: okita-io/agent-crm).
#
# Default profile uses Postgres (matches the eventual NAS target) so the whole
# machine runs the way it will in production. To run against the SQLite file
# instead, comment out the `db` service + depends_on and set CRM_DATABASE_URL
# to the sqlite path in a .env file.
#
# Spark SGLang queue: CRM agents must use spark-queue (not Spark directly) so
# Hermes + CRM share one global 4-session GPU cap on Spark.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: agent_crm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d agent_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  spark-queue:
    build: .
    command: ["spark-queue"]
    environment:
      # Reach Spark on the ranch LAN via extra_hosts (spark -> 10.0.1.3).
      SPARK_LLM_BASE_URL: http://spark:8888/v1
      SPARK_LLM_MODEL: qwen3.8-27b-sglang
      SPARK_LLM_MAX_CONCURRENCY: "4"
      SPARK_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
    extra_hosts:
      - "spark:10.0.1.3"
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_API_HOST: 0.0.0.0
      CRM_API_PORT: "8000"
      CRM_API_TOKEN: ${CRM_API_TOKEN:-changeme}
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_SEARXNG_URL: http://host.docker.internal:8080
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
      CRM_HUNTER_MAX_PAGES_PER_RUN: "50"
      CRM_HUNTER_SEARCH_RESULT_LIMIT: "50"
      CRM_HUNTER_MAX_QUERIES_DEFAULT: "0"
      CRM_HUNTER_MAX_MINUTES_DEFAULT: "0"
      CRM_RESEARCH_MAX_QUERIES_DEFAULT: "20"
      CRM_RESEARCH_MAX_PAGES_PER_RUN: "200"
      CRM_RESEARCH_MAX_MINUTES_DEFAULT: "60"
      CRM_RESEARCH_SEARCH_RESULT_LIMIT: "50"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      spark-queue:
        condition: service_started

  dashboard:
    build: .
    command: ["dashboard"]
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_DASHBOARD_PORT: "8501"
      CRM_DASHBOARD_PASSWORD: ${CRM_DASHBOARD_PASSWORD:-}
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_API_BASE_URL: http://api:8000
      CRM_API_TOKEN: ${CRM_API_TOKEN:-changeme}
      CRM_OBSERVER_LIVE_REFRESH_SECONDS: "5"
      CRM_OBSERVER_REFRESH_SECONDS: "600"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started

  contact-worker:
    build: .
    command: ["agent-crm", "jobs"]
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_SEARXNG_URL: http://host.docker.internal:8080
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  hunt-loop:
    build: .
    command: ["agent-crm", "hunt-loop"]
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_SEARXNG_URL: http://host.docker.internal:8080
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
      CRM_HUNTER_MAX_QUERIES_DEFAULT: "0"
      CRM_HUNTER_MAX_MINUTES_DEFAULT: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started
    restart: unless-stopped

  research-loop:
    build: .
    command:
      - agent-crm
      - research-loop
      - --watch
      - --max-queries
      - "20"
      - --max-pages
      - "200"
      - --max-minutes
      - "60"
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_SEARXNG_URL: http://host.docker.internal:8080
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
      CRM_RESEARCH_MAX_QUERIES_DEFAULT: "20"
      CRM_RESEARCH_MAX_PAGES_PER_RUN: "200"
      CRM_RESEARCH_MAX_MINUTES_DEFAULT: "60"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started
    restart: unless-stopped

  engagement-loop:
    build: .
    command:
      - agent-crm
      - engagement-loop
      - --watch
      - --max-venues
      - "10"
      - --max-pages-per-venue
      - "15"
      - --max-minutes
      - "45"
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_SEARXNG_URL: http://host.docker.internal:8080
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
      CRM_ENGAGEMENT_MAX_VENUES_PER_RUN: "10"
      CRM_ENGAGEMENT_MAX_PAGES_PER_VENUE: "15"
      CRM_ENGAGEMENT_MAX_MINUTES_DEFAULT: "45"
      CRM_ENGAGEMENT_MAX_BRANCH_TERMS: "8"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started
    restart: unless-stopped

  seo-loop:
    build: .
    command:
      - agent-crm
      - seo-loop
      - --watch
      - --max-targets
      - "0"
      - --max-pages-per-target
      - "4"
      - --max-minutes
      - "0"
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_SEARXNG_URL: http://host.docker.internal:8080
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
      CRM_SEO_MAX_TARGETS_PER_RUN: "0"
      CRM_SEO_MAX_PAGES_PER_TARGET: "4"
      CRM_SEO_MAX_MINUTES_DEFAULT: "0"
      CRM_SEO_REVIEW_HOUR: "12"
      CRM_SEO_REVIEW_TIMEZONE: "America/Los_Angeles"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started
    restart: unless-stopped

  aeo-geo-loop:
    build: .
    command:
      - agent-crm
      - aeo-geo-loop
      - --watch
      - --max-targets
      - "0"
      - --max-pages-per-target
      - "4"
      - --max-minutes
      - "0"
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_FIRECRAWL_URL: http://host.docker.internal:3002
      CRM_SEO_MAX_TARGETS_PER_RUN: "0"
      CRM_SEO_MAX_PAGES_PER_TARGET: "4"
      CRM_SEO_MAX_MINUTES_DEFAULT: "0"
      CRM_SEO_REVIEW_HOUR: "12"
      CRM_SEO_REVIEW_TIMEZONE: "America/Los_Angeles"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started
    restart: unless-stopped

  queue-review:
    build: .
    command:
      - agent-crm
      - queue-review
      - --watch
      - --max-queries
      - "40"
      - --max-minutes
      - "0"
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_QUEUE_REVIEW_POLL_SECONDS: "20"
      CRM_QUEUE_REVIEW_MAX_QUERIES: "40"
      CRM_QUEUE_REVIEW_SPARK_PER_CYCLE: "8"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      spark-queue:
        condition: service_started
    restart: unless-stopped

  orchestrator:
    build: .
    command: ["agent-crm", "orchestrate"]
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/agent_crm
      CRM_LLM_BASE_URL: http://spark-queue:8088/v1
      CRM_LLM_QUEUE_TOKEN: ${SPARK_LLM_QUEUE_TOKEN:-}
      CRM_ORCHESTRATOR_POLL_SECONDS: "180"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  crm_pgdata:
