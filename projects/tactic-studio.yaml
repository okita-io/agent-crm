slug: tactic-studio
name: tactic.studio
status: live
enabled: true
site: https://tactic.studio
alias: null
context_file: brand-context.tactic-studio.md
origin_prompt: |
  tactic.studio is an immersive / WebAR / XR experience vendor for museums,
  campuses, libraries, and cultural institutions. Buyer ICP: universities,
  museums, libraries, and cultural institutions that were AWARDED US federal,
  state, or local grants for interactive exhibits, immersive media, AR/XR,
  digital storytelling, or campus experience projects (IMLS, NEA, NEH,
  Grants.gov, USASpending, state arts councils). Hunt award recipients and
  named vendor/partners on grant pages — not generic industrial retail lists.
  Research and CRM enrichment only. Outbound email/DM is Pete-gated
  (pete@tactic.studio + naming-rights). Never invent emails or auto-send.
channels:
  research:
    armed: true
    prompt: |
      Default kinds: target_company, competitor, ad_placement.
      Focus: institutions awarded US gov grants for interactive / museum /
      campus / exhibit / AR-XR / immersive / digital-media projects over $100k.
      Scrape IMLS, NEA, NEH, Grants.gov, USASpending, and state arts council
      award pages. Extract recipient institution, grant title, award amount,
      project description, and named vendors/partners. Tag findings for the
      gov-grants cultural interactive lane.
  hunter:
    armed: true
    prompt: |
      Priority: marketing, exhibits, digital media, and experience-production
      contacts at grant-awarded museums, universities, libraries, and cultural
      campuses. Hunt leadership directories, press releases, and grant award
      pages naming exhibit/interactive project leads. Secondary: XR creators
      covering museum/campus immersive work. Audience-tagged seeds. Never
      invent emails. No outbound send.
  seo:
    armed: true
    prompt: |
      Owned site https://tactic.studio. Write review and plan documents only.
      Never patch live pages or deploy markup.
  aeo_geo:
    armed: true
    prompt: |
      Document extractable answers and citation readiness for tactic.studio.
      Outreach steps stay research/docs only — Pete + naming-rights gate.
  engage:
    armed: true
    prompt: |
      Museum, campus, library, and cultural-institution venues where
      interactive / immersive grant projects are discussed. Helpful-first
      drafts. Conversion CTAs stay human-gated. Never publish from draft agents.
  publish:
    armed: false
    prompt: |
      Pete-gated. Keep publish off unless CRM_PUBLISH_ALLOW_TACTIC_STUDIO and
      an explicit Pete override are set on the schedule path.
